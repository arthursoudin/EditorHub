var st=document.getElementById('stage'),pages=[],cur=0,busy=false,W=0,H=0;
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstChild}
function hs(x,y,id,label){return '<button class="hs" data-a="'+id+'" aria-label="'+label+'" style="left:'+x+'%;top:'+y+'%"></button>'}
IMGS.forEach(function(s,i){
  var extra='';
  if(i==4)extra='<div class="t" style="top:80.5%;font-size:3.9cqw;color:#3c3836">'+NOME.replace('Figueira','Figueira<br>')+'</div>';
  if(i==5)extra='<div class="t" style="top:38.6%;font-size:3cqw;color:#3b3030">'+NOME+'</div>'+hs(50,95.5,'insta','Instagram');
  if(i==6)extra=hs(49.8,69.5,'map','Local da cerimônia')+hs(75.8,69.5,'gift','Lista de presentes')+hs(61,85.5,'pix','Presente em Pix');
  var p=el('<div class="pg"><div class="face"><img alt="" src="data:image/jpeg;base64,'+s+'">'+extra+'<div class="fs"></div></div><div class="cast"></div><div class="flap"><img alt="" src="data:image/jpeg;base64,'+s+'"><div class="fg"></div></div></div>');
  st.appendChild(p);pages.push({e:p,f:p.firstChild,fs:p.firstChild.lastChild,ca:p.children[1],fl:p.lastChild,t:0});
});
function clip(poly,nx,ny,d,keep){var o=[];for(var i=0;i<poly.length;i++){var a=poly[i],b=poly[(i+1)%poly.length];
  var sa=(keep?1:-1)*(nx*a[0]+ny*a[1]-d),sb=(keep?1:-1)*(nx*b[0]+ny*b[1]-d);
  if(sa<=0)o.push(a);if((sa<0&&sb>0)||(sa>0&&sb<0)){var k=sa/(sa-sb);o.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k])}}return o}
function css(p){return 'polygon('+p.map(function(q){return q[0].toFixed(1)+'px '+q[1].toFixed(1)+'px'}).join(',')+')'}
function render(i,t){var P=pages[i];P.t=t;
  if(t<=0.001){st.style.transform='none';P.e.style.visibility='visible';P.f.style.clipPath='none';P.fl.style.display='none';P.ca.style.display='none';P.fs.style.background='none';return}
  if(t>=0.999){st.style.transform='none';P.e.style.visibility='hidden';return}
  P.e.style.visibility='visible';
  var L=Math.hypot(W,H),nx=W/L,ny=H/L,d=L*(1-t),R=[[0,0],[W,0],[W,H],[0,H]],A=(Math.atan2(nx,-ny)*180/Math.PI).toFixed(2)+'deg';
  P.f.style.clipPath=css(clip(R,nx,ny,d,true));
  P.fs.style.background='linear-gradient('+A+',rgba(0,0,0,0) '+(d-70)+'px,rgba(0,0,0,.16) '+(d-12)+'px,rgba(0,0,0,.34) '+d+'px)';
  var rm=css(clip(R,nx,ny,d,false));
  P.ca.style.display='block';P.ca.style.clipPath=rm;
  P.ca.style.background='linear-gradient('+A+',rgba(0,0,0,.45) '+d+'px,rgba(0,0,0,.15) '+(d+60)+'px,rgba(0,0,0,0) '+(d+170)+'px)';
  P.fl.style.display='block';P.fl.style.clipPath=rm;
  P.fl.style.transform='matrix('+(1-2*nx*nx)+','+(-2*nx*ny)+','+(-2*nx*ny)+','+(1-2*ny*ny)+','+(2*d*nx)+','+(2*d*ny)+')';
  P.fl.lastChild.style.background='linear-gradient('+A+',rgba(70,55,40,.6) '+d+'px,rgba(255,255,255,.1) '+(d+14)+'px,rgba(255,255,255,.78) '+(d+60)+'px,rgba(255,255,255,.5) '+(d+220)+'px)';
  var s=Math.sin(Math.PI*t);st.style.transform='rotateX('+(3*s)+'deg) rotateY('+(-4*s)+'deg)';}
function size(){W=st.clientWidth;H=st.clientHeight;pages.forEach(function(p,i){render(i,p.t)})}
function z(){pages.forEach(function(p,i){p.e.style.zIndex=pages.length-i})}
function anim(i,from,to,done){busy=true;var s=performance.now(),D=700*Math.abs(to-from)+120;
  (function f(n){var k=Math.min(1,(n-s)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;render(i,from+(to-from)*e);
    if(k<1)requestAnimationFrame(f);else{busy=false;done&&done()}})(s)}
function next(){if(busy||cur>=pages.length-1)return;var i=cur;anim(i,pages[i].t,1,function(){cur=i+1})}
function prev(){if(busy||cur<=0)return;var i=cur-1;cur=i;anim(i,pages[i].t,0)}
var sx=null,sy=0,drag=false,dir=0;
st.addEventListener('pointerdown',function(e){if(busy)return;sx=e.clientX;sy=e.clientY;drag=false;dir=0});
st.addEventListener('pointermove',function(e){if(sx===null||busy)return;var dx=e.clientX-sx;
  if(!drag&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(e.clientY-sy)){drag=true;dir=dx<0?1:-1;st.setPointerCapture(e.pointerId)}
  if(drag){if(dir==1&&cur<pages.length-1)render(cur,Math.min(1,Math.max(0,-dx/(W*.9))));
    if(dir==-1&&cur>0)render(cur-1,1-Math.min(1,Math.max(0,dx/(W*.9))))}});
st.addEventListener('pointerup',function(e){if(sx===null)return;var dx=e.clientX-sx;sx=null;
  if(drag){drag=false;if(dir==1&&cur<pages.length-1){var i=cur;if(pages[i].t>.25)anim(i,pages[i].t,1,function(){cur=i+1});else anim(i,pages[i].t,0)}
    else if(dir==-1&&cur>0){var j=cur-1;if(pages[j].t<.75){cur=j;anim(j,pages[j].t,0)}else anim(j,pages[j].t,1)}return}
  var b=e.target.closest&&e.target.closest('.hs');
  if(b){act(b.dataset.a);return}
  var r=st.getBoundingClientRect();(e.clientX-r.left>r.width*.4)?next():prev()});
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;setTimeout(function(){t.style.opacity=0},2200)}
function act(a){var u={map:MAPS_URL,gift:GIFT_URL,pix:PIX_URL,insta:INSTA_URL}[a];
  if(u)window.open(u,'_blank','noopener');else toast('Link ainda não configurado')}
document.addEventListener('keydown',function(e){if(e.key=='ArrowRight')next();if(e.key=='ArrowLeft')prev()});
var au=document.getElementById('aud'),sn=document.getElementById('snd'),on=true;au.volume=.6;
sn.onclick=function(){on=!on;sn.textContent=on?'🔊':'🔇';on?au.play().catch(function(){}):au.pause()};
function open_(){document.getElementById('intro').classList.add('go');if(on)au.play().catch(function(){})}
var it=document.getElementById('intro');it.onclick=open_;it.onkeydown=function(e){if(e.key=='Enter'||e.key==' ')open_()};
z();size();window.addEventListener('resize',size);
